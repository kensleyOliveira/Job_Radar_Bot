name: Radar de Vagas Agendado

on:
  schedule:
    # Executa 3 vezes ao dia: às 09:00, 14:00 e 19:00 UTC (horários de pico de vagas)
    - cron: '0 9,14,19 * * *'
  # Permite acionar o radar manualmente a qualquer momento pelo painel do GitHub
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Evita que processos presos excedam o tempo de quota

    steps:
      - name: Obter o código-fonte
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Guarda em cache as bibliotecas para acelerar os próximos deploys

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache dos binários do Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependências do Playwright (Apenas se não estiver em cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: Instalar apenas dependências de sistema do Playwright (Se em cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Executar o Radar de Vagas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python run_radar_cli.py